[build-system]
requires = ["setuptools >= 80"]
build-backend = "setuptools.build_meta"

[project]
name = "nplsizer"
dynamic = ["version"]
authors = [
  { name="Sarit Dutta", email="saridut@gmail.com" },
]
description = "Semi-automatically calculates the size of rectangular nanoplatelets from microscopy images"
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX",
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "numpy >= 2.0.0",
    "scipy >= 1.18.0",
    "scikit-image >= 0.26",
    "pyqt6 >= 6.11",
    "napari[pyqt6, optional] >= 0.7",
    "magicgui[pyqt6,image,quantity] >= 0.10",
    "opencv-python >= 5.0",
    "dm3-lib @ git+https://github.com/piraynal/pyDM3reader.git@v2.0",
    ]

[project.urls]
repository = "https://github.com/saridut/nplsizer.git"
#download = 

[project.scripts]
nplsizer = "nplsizer:cli.run"

[tool.setuptools.dynamic]
version = {attr = "nplsizer.__version__"} 

[tool.ruff]
line-length = 79
indent-width = 4

# Assume Python 3.10
target-version = "py311"

[tool.ruff.lint]
# select = [...]  # See the Default Rules page for the full listing.
ignore = []

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.pydocstyle]
convention = "numpy"

# If set to true, ignore missing documentation for *args and **kwargs parameters.
ignore-var-parameters = true

[tool.ruff.format]
quote-style = "double"

# Use the configured quote style for nested strings (Python 3.12+ only).
nested-string-quote-style = "preferred"

indent-style = "space"

# Respect magic trailing commas.
skip-magic-trailing-comma = false

# Automatically detect the appropriate line ending.
line-ending = "native"

# Enable auto-formatting of code examples in docstrings. Markdown,
# reStructuredText code/literal blocks and doctests are all supported.
#
# This is currently disabled by default, but it is planned for this
# to be opt-out in the future.
docstring-code-format = false

# Set the line length limit used when formatting code snippets in
# docstrings.
#
# This only has an effect when the `docstring-code-format` setting is
# enabled.
docstring-code-line-length = "dynamic"
